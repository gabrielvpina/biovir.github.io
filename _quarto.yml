# Configuracao comum aos dois idiomas.
# O conteudo especifico de cada lingua fica em _quarto-pt.yml e _quarto-en.yml.
# Use sempre ./build.sh para gerar o site completo em docs/.

project:
  type: website
  output-dir: docs
  resources:
    - "assets/*.png"
    - "assets/*.svg"
    - "members/**/*.png"
    - "members/**/*.jpeg"
    - "members/**/*.jpg"
    - "eventos/**/*.jpg"
    - "eventos/**/*.jpeg"
    - "eventos/**/*.png"
    - "eventos/**/*.webp"
    - "fonts/*.woff2"
    - ".nojekyll"
    - "CNAME"
    # as paginas em ingles sao geradas pelo perfil "en" (ver build.sh)
    - "!/en/**"

profile:
  default: pt

website:
  title: "BioVirLab"
  favicon: assets/logo-without-text-virus.png
  # precisa ser o dominio real (ver CNAME): o Quarto usa esta URL para
  # decidir o que e' link externo e marcar com target="_blank"
  site-url: "https://www.biovirlab.com.br"
  navbar:
    logo: assets/logo-horizontal-small.png
    logo-alt: "BioVirLab"
    title: false
    pinned: true
  page-footer:
    border: true
    center: |
      [Instagram](https://www.instagram.com/biovir.lab/)

format:
  html:
    theme:
      - cosmo
      - styles/biovir.scss
    css: styles/fonts.css
    include-after-body: js/lang-switch.html
    toc: false
    anchor-sections: false
    # desligado de proposito: o zenscroll que o Quarto injeta com smooth-scroll
    # intercepta a navegacao por ancora e o link da home para #colaboracoes
    # nao rolava ate a secao. O site nao tem sumario nem links internos de
    # pagina, entao o scroll suave nao fazia falta.
    smooth-scroll: false
    link-external-newwindow: true
